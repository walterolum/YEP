spring:
  application:
    name: youthrise-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/youthrise?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:youthrise}
    # Development default only. Set DB_PASSWORD in every deployed environment.
    password: ${DB_PASSWORD:youthrise_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

  session:
    timeout: 8h
    jdbc:
      initialize-schema: never

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 8h
      cookie:
        name: YOUTHRISE_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    cookie-secure: ${COOKIE_SECURE:false}
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  mail:
    mode: ${MAIL_MODE:log}
    from: ${MAIL_FROM:no-reply@youthrise.local}
  public-app-url: ${PUBLIC_APP_URL:http://localhost:5173}
  policy-version: ${POLICY_VERSION:2026-10}
  uploads:
    directory: ${UPLOAD_DIR:uploads}

logging:
  level:
    com.youthrise: INFO
    org.springframework.security: INFO
