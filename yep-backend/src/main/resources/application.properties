spring.application.name=yep

# ---------------------------------------------------------------------------
# Database. Override with environment variables; never commit real credentials.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/yep?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.open-in-view=false
# Flyway owns the schema; Hibernate must never change it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
# Pinned because the local server (MariaDB 12.2) is newer than Hibernate's detection table.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# ---------------------------------------------------------------------------
# JWT. APP_JWT_SECRET must be at least 32 characters in any real deployment.
# ---------------------------------------------------------------------------
app.jwt.secret=${APP_JWT_SECRET:change-me-dev-secret-key-at-least-32-characters}
app.jwt.ttl-hours=${APP_JWT_TTL_HOURS:2}
app.uploads.directory=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.frontend.url=${APP_FRONTEND_URL:http://localhost:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}

logging.level.ug.yep=INFO
